name: run strategy

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v3

    - name: install packages
      run: |
        pip install -r requirements.txt

    - name: run strategy
      env:
        LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
      run: |
        python main.py
