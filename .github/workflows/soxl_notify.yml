name: SOXL Strategy Daily Notify

on:
  schedule:
    - cron: '40 20 * * 1-5'   # UTC 20:40 = 冬時間 日本5:40（遅延込みで6-7時台想定）
  workflow_dispatch:             # 手動実行も可能

jobs:
  notify:
    runs-on: ubuntu-latest

    # 【重要】Node.js 20 廃止警告に対応するための設定
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write   # state.jsonの更新・GitHubへの保存に必須

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # V15で追加された可視化（グラフ作成）に必要な matplotlib を含めています
        run: pip install yfinance pandas numpy requests matplotlib

      - name: Run strategy
        env:
          # GitHubのSettings > Secrets で設定したトークンを呼び出します
          LINE_TOKEN:         ${{ secrets.LINE_TOKEN }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
        # 実行するファイル名が soxl_notify.py であることを確認してください
        run: python soxl_notify.py
