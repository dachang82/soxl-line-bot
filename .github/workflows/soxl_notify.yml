name: SOXL Strategy Daily Notify

on:
  schedule:
    - cron: '40 20 * * 1-5'   # UTC 20:40 = 冬時間 日本5:40（遅延込みで6-7時台想定）
  workflow_dispatch:             # 手動実行も可能

jobs:
  notify:
    runs-on: ubuntu-latest
    
    # Node.js 20 廃止警告への対応
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write   # state.jsonのpushに必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # V15の可視化ロジックのために matplotlib を追加
        run: pip install yfinance pandas numpy requests matplotlib

      - name: Run strategy
        env:
          LINE_TOKEN:         ${{ secrets.LINE_TOKEN }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
        run: python soxl_notify.py
